<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__PAGE_NAME__</title>
  <link rel="stylesheet" href="../vendor/tdesign.min.css">
  <link rel="stylesheet" href="../vendor/aiux/aiux-panel.css">
  <style>
    body {
      margin: 0;
      background: var(--td-bg-color-page);
      color: var(--td-text-color-primary);
      font-family: var(--td-font-family);
    }

    .aiux-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 112px;
    }

    .aiux-page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--td-component-stroke);
    }

    .aiux-page-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--td-text-color-placeholder);
      font-size: var(--td-font-size-body-small);
      line-height: var(--td-line-height-body-small);
    }

    .aiux-page-title {
      margin: 8px 0 0;
      color: var(--td-text-color-primary);
      font-size: var(--td-font-size-title-extraLarge);
      line-height: var(--td-line-height-title-extraLarge);
      font-weight: 600;
    }

    .aiux-page-body {
      margin-top: 24px;
      padding: 48px 24px;
      border: 1px solid var(--td-component-stroke);
      border-radius: var(--td-radius-large);
      background: var(--td-bg-color-container);
    }
  </style>
</head>
<body>
  <!--
    页面说明：
    1. 这里是 TDesign 高保真原型，不是生产代码。
    2. 页面内容直接写在 #app 里，Vue 会把它当作 in-DOM 模板编译。
    3. in-DOM 模板中自定义组件必须写闭合标签，例如 <t-icon ...></t-icon>，不能写 <t-icon />。
    4. 颜色、字号、圆角、阴影、边框只能用 var(--td-*)，间距和尺寸可以用 px。
  -->
  <div id="app">
    <main class="aiux-page" data-aiux="page-root">
      <header class="aiux-page-head">
        <div>
          <div class="aiux-page-kicker">
            <t-icon name="check-circle" size="16px" data-aiux="page-icon"></t-icon>
            <span>TDesign 高保真原型</span>
          </div>
          <h1 class="aiux-page-title">__PAGE_NAME__</h1>
        </div>
        <t-button theme="primary" data-aiux="page-primary-action">主操作</t-button>
      </header>

      <div class="aiux-page-body" data-aiux="page-empty">
        <t-empty
          title="页面内容待生成"
          description="先按七章大纲写本页交互说明，再用 TDesign 组件生成页面内容。"
        >
          <template #action>
            <t-button variant="outline">示例操作</t-button>
          </template>
        </t-empty>
      </div>
    </main>
  </div>

  <script type="application/json" id="aiux-spec">__PAGE_SPEC__</script>

  <script src="../vendor/vue.global.prod.js"></script>
  <script src="../vendor/tdesign.min.js"></script>
  <script src="../vendor/tdesign-sprite.js"></script>
  <script src="../vendor/aiux/aiux-panel.js"></script>
  <script>
    (function () {
      // 图标 sprite 已经本地引入，关闭 TDesign 的 CDN 默认图标加载，保证断网可用。
      if (TDesign.Icon && TDesign.Icon.props && TDesign.Icon.props.loadDefaultIcons) {
        TDesign.Icon.props.loadDefaultIcons.default = false;
      }
      var app = Vue.createApp({});
      app.use(TDesign);
      app.mount('#app');
    })();
  </script>
</body>
</html>
